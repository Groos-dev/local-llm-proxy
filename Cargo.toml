[package]
name = "local-llm-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "=0.3.6"
axum = "=0.8.9"
bytes = "=1.11.1"
futures-util = "=0.3.32"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "net"] }
