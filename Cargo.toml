[package]
name = "agent-proxy"
version = "0.2.0"
edition = "2024"
autobins = false

[[bin]]
name = "agent-proxy-server"
path = "src/main.rs"

[[bin]]
name = "agent-proxy"
path = "src/bin/agent_proxy.rs"

[dependencies]
async-stream = "=0.3.6"
axum = "=0.8.9"
base64 = "0.22"
bytes = "=1.11.1"
cliclack = "0.5.6"
console = "0.16"
env_logger = "0.11"
futures = "0.3"
futures-util = "=0.3.32"
log = "0.4"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "net", "time"] }
toml = "=0.9.12"
