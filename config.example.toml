bind_addr = "127.0.0.1:8787"
exchange_log_dir = ".run/exchanges"
active_provider = "responses-example"

# Upstream speaks OpenAI Responses (passthrough, including /responses/compact).
[[providers]]
name = "responses-example"
base_url = "https://api.openai.com/v1"
# Set true when base_url is already the final upstream endpoint.
# is_full_url = true
api_key = "replace-me"
api_format = "openai_responses"

# Upstream speaks OpenAI Chat Completions.
# Compact is bridged to /chat/completions (same as cc-switch).
[[providers]]
name = "chat-example"
base_url = "https://api.example.com/v1"
api_key = "replace-me"
api_format = "openai_chat"

# Upstream speaks Anthropic Messages.
# Compact is bridged to /v1/messages (same as cc-switch).
[[providers]]
name = "anthropic-example"
base_url = "https://api.anthropic.com"
api_key = "replace-me"
api_format = "anthropic"
# max_output_tokens = 16384
